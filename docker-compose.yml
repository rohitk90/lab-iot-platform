services:
  # ---------------------------------------------------------------------------
  # One-shot bootstrap: create host data dirs and fix ownership so the
  # containers that run as non-root UIDs can write to their volumes.
  # Exits 0 immediately after; it will show as "Exited (0)" in `docker ps -a`.
  # ---------------------------------------------------------------------------
  init-permissions:
    image: alpine:3.20
    container_name: lab_init_permissions
    restart: "no"
    volumes:
      - ${DATA_PATH}:/data
    command: >
      sh -c "
        set -e;
        mkdir -p /data/emqx /data/grafana /data/timescaledb /data/redis /data/minio;
        chown -R 1000:1000 /data/emqx;
        chown -R 472:472   /data/grafana;
        chown -R 999:999   /data/timescaledb;
        chown -R 999:999   /data/redis;
        chown -R 1000:1000 /data/minio;
        echo 'init-permissions: done';
      "

  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: lab_timescaledb
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_PATH}/timescaledb:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    depends_on:
      init-permissions:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.8.0
    container_name: lab_emqx
    restart: always
    volumes:
      - ${DATA_PATH}/emqx:/opt/emqx/data
    ports:
      - "1883:1883"     # MQTT Connection Port
      - "18083:18083"   # EMQX Admin Dashboard Web Interface
    depends_on:
      init-permissions:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: lab_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ${DATA_PATH}/redis:/data
    ports:
      - "6379:6379"
    depends_on:
      init-permissions:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  minio:
    image: pgsty/minio
    container_name: lab_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_PATH}/minio:/data
    ports:
      - "9000:9000"     # API Endpoint
      - "9001:9001"     # Web Console
    command: server /data --console-address ":9001"
    depends_on:
      init-permissions:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: lab_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Securely inject database credentials from .env to hide plain-text passwords
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_PATH}/grafana:/var/lib/grafana
      - ./infra/grafana/provision:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"     # Grafana UI (also fronted by nginx)
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      timescaledb:
        condition: service_started

  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: lab_nginx
    restart: always
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"         # Unified Web Access Port for the 40 desktops
    depends_on:
      - grafana

  # ---------------------------------------------------------------------------
  telegraf_server:
    image: telegraf:alpine
    container_name: lab_telegraf_server
    restart: always
    environment:
      - TELEGRAF_DB_CONNECTION=host=timescaledb user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable
      - TELEGRAF_MQTT_USER=${TELEGRAF_MQTT_USER}
      - TELEGRAF_MQTT_PASSWORD=${TELEGRAF_MQTT_PASSWORD}
    volumes:
      - ./infra/telegraf_server/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - emqx
      - timescaledb
