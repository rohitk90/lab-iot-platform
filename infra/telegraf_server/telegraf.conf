[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1ms"
  hostname = "central-server-router"

# ==============================================================================
# 1. INPUT LAYER: Subscribe to EMQX Broker Telemetry Channels
# ==============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["lab/+/telemetry"]
  data_format = "json"
  tag_keys = ["asset_id"]
  username = "${TELEGRAF_MQTT_USER}"
  password = "${TELEGRAF_MQTT_PASSWORD}"

# ==============================================================================
# 2. PROCESSOR LAYER: Convert Wide JSON keys into Vertical Narrow Rows
# ==============================================================================
[[processors.unpivot]]
  tag_key = "tag_name"
  value_key = "sensor_value"

# ==============================================================================
# 3. OUTPUT LAYER: Route metrics natively into TimescaleDB Staging Table
# ==============================================================================
[[outputs.sql]]
  driver = "pgx"
  data_source_name = "${TELEGRAF_DB_CONNECTION}"
  
  # Base table mapping properties
  table_template = "telemetry_stage"
