[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 200000
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1ms"
  hostname = "central-server-router"

[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["lab/+/telemetry"]
  qos = 1
  persistent_session = true
  client_id = "central-telegraf"
  data_format = "json_v2"
  topic_tag = "topic"
  username = "${TELEGRAF_MQTT_USER}"
  password = "${TELEGRAF_MQTT_PASSWORD}"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "mqtt_consumer"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "fields"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "tags"
      tags = ["asset_id", "host"]

[[outputs.postgresql]]
  connection = "${TELEGRAF_DB_CONNECTION}"
  schema = "platform_data"
  fields_as_jsonb = true
  tags_as_foreign_keys = false
  timestamp_column_name = "time"
  timestamp_column_type = "timestamp with time zone"
