apiVersion: 1

datasources:
  - name: PyroSmart-PIBO
    uid: pyrosmart-pibo
    type: postgres
    access: proxy
    url: pibo_db:5432
    database: ${PIBO_DB_NAME}
    user: ${PIBO_DB_USER}
    secureJsonData:
      password: ${PIBO_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      timeInterval: "15m"
    isDefault: false
    editable: true
